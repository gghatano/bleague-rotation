name: pipeline

on:
  workflow_call:
    inputs:
      live:
        description: '試合中の試合も取り込み、コミット・issue通知をせずに公開だけする'
        type: boolean
        default: false
      date:
        description: 'YYYYMMDD。空なら既定の日付（確定版は前日、live は最新の開催日）'
        type: string
        default: ''

env:
  LIVE: ${{ inputs.live }}

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -t .
      - name: Fetch and analyze games
        if: github.event_name != 'push'
        env:
          DATE: ${{ inputs.date }}
        run: |
          args=(--report report.json)
          if [ "$LIVE" = true ]; then args+=(--live); fi
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          python -m rotation update "${args[@]}"
      - name: Decide whether to deploy
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$LIVE" != true ] || [ -n "$(git status --porcelain -- data)" ]; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          else
            echo deploy=false >> "$GITHUB_OUTPUT"
          fi
      - name: Commit data
        if: github.event_name != 'push' && env.LIVE != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update game data'
            git push
          fi
      - name: Open or close issues for detected problems
        if: github.event_name != 'push' && env.LIVE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m rotation notify report.json --repo "$GITHUB_REPOSITORY"
      - name: Build site
        if: steps.changes.outputs.deploy == 'true'
        run: python -m rotation build --out _site
      - if: steps.changes.outputs.deploy == 'true'
        uses: actions/configure-pages@v6
      - if: steps.changes.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
