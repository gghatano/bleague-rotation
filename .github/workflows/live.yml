name: live

# 起動は Cloudflare Workers の Cron Trigger から workflow_dispatch で行う（workers/live-trigger）
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    with:
      live: true
